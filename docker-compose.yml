services:
  backend:
    build:
      context: ./backend
    image: camping-simulator-backend:local
    restart: unless-stopped
    environment:
      PORT: "8787"
      ALLOWED_ORIGINS: "http://localhost:8080"
    volumes:
      - ./data:/app/data
    # ports:
    #   - "8787:8787"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    image: camping-simulator-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8094:80"

volumes:
  backend-data:
